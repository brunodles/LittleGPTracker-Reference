<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Visual Reference</title>

    <style>
        :root {
            --bg: #111;
            --panel: #1c1c1c;
            --border: #444;
            --text: #eee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--border);
        }

        .tracker-section {
            min-height: 100vh;
            padding: 20px;
            border-bottom: 2px solid var(--border);
        }

        .tracker-section h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid var(--border);
            padding: 00px;
            vertical-align: top;
        }

        .image-frame {
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        /*
         * Crop configuration:
         *
         * --crop-top
         * --crop-right
         * --crop-bottom
         * --crop-left
         *
         * Values are pixels.
         */
        .cropped-image {
            display: block;

            width: calc(
                    100% +
                    var(--crop-left, 0px) +
                    var(--crop-right, 0px)
            );

            margin-top: calc(-1 * var(--crop-top, 0px));
            margin-right: calc(-1 * var(--crop-right, 0px));
            margin-bottom: calc(-1 * var(--crop-bottom, 0px));
            margin-left: calc(-1 * var(--crop-left, 0px));

            image-rendering: pixelated;
        }

        .caption {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
